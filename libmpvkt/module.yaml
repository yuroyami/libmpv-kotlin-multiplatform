# The typed API: Mpv, the node model, the catalogs, the events, the playback state, the stream
# providers and the deprecated MPVLib facade. It exports libmpvkt-native, so an app names one artifact.
product:
  type: kmp/lib
  platforms: [ android ]

apply:
  - //libmpvkt.module-template.yaml
  - //android.module-template.yaml
  - //library.module-template.yaml

dependencies:
  - //libmpvkt-native: exported
  - $libs.kotlinx.coroutines.core: exported

test-dependencies:
  - $libs.kotlinx.coroutines.test

settings:
  android:
    namespace: io.github.yuroyami.libmpvkt
  publishing:
    pom:
      name: libmpvkt
      description: "The typed Kotlin API for libmpv on Android: Mpv, one class per mpv core. It brings libmpvkt-native, which holds mpv, FFmpeg, libass, dav1d and their dependencies, prebuilt for arm64-v8a, armeabi-v7a, x86 and x86_64. The native libraries are GPL."

plugins:
  android-abi-check: enabled
