# Tasks of libmpv-kmp-native. The link and interop tasks read the static mpv trees in buildscripts/prefix/
# and never build them.

tasks:
  jniMacosArm64:
    action: !io.github.yuroyami.libmpv.buildplugins.mpvnatives.linkDesktopJni
      platform: macos-arm64
      homebrewPrefix: ${pluginSettings.homebrewPrefix}
      kotlinVersion: ${pluginSettings.kotlinVersion}
      jniSources: ${module.rootDir}/native/jni
      mpvHeaders: ${module.rootDir}/native/include
      prefixTree: ${project.rootDir}/buildscripts/prefix/macos-arm64
      workDir: ${taskOutputDir}/work
      resourcesDir: ${taskOutputDir}/resources

  jniLinuxX64:
    action: !io.github.yuroyami.libmpv.buildplugins.mpvnatives.linkDesktopJni
      platform: linux-x64
      homebrewPrefix: ${pluginSettings.homebrewPrefix}
      kotlinVersion: ${pluginSettings.kotlinVersion}
      jniSources: ${module.rootDir}/native/jni
      mpvHeaders: ${module.rootDir}/native/include
      prefixTree: ${project.rootDir}/buildscripts/prefix/linux-x64
      workDir: ${taskOutputDir}/work
      resourcesDir: ${taskOutputDir}/resources

  jniLinuxArm64:
    action: !io.github.yuroyami.libmpv.buildplugins.mpvnatives.linkDesktopJni
      platform: linux-arm64
      homebrewPrefix: ${pluginSettings.homebrewPrefix}
      kotlinVersion: ${pluginSettings.kotlinVersion}
      jniSources: ${module.rootDir}/native/jni
      mpvHeaders: ${module.rootDir}/native/include
      prefixTree: ${project.rootDir}/buildscripts/prefix/linux-arm64
      workDir: ${taskOutputDir}/work
      resourcesDir: ${taskOutputDir}/resources

  jniWindowsX64:
    action: !io.github.yuroyami.libmpv.buildplugins.mpvnatives.linkDesktopJni
      platform: windows-x64
      homebrewPrefix: ${pluginSettings.homebrewPrefix}
      kotlinVersion: ${pluginSettings.kotlinVersion}
      jniSources: ${module.rootDir}/native/jni
      mpvHeaders: ${module.rootDir}/native/include
      prefixTree: ${project.rootDir}/buildscripts/prefix/windows-x64
      workDir: ${taskOutputDir}/work
      resourcesDir: ${taskOutputDir}/resources

  mpvInteropMacosArm64:
    action: !io.github.yuroyami.libmpv.buildplugins.mpvnatives.writeMpvInterop
      konanTarget: macos_arm64
      homebrewPrefix: ${pluginSettings.homebrewPrefix}
      mpvHeaders: ${module.rootDir}/native/include
      prefixTree: ${project.rootDir}/buildscripts/prefix/macos-arm64
      defFile: ${taskOutputDir}/def/mpv.def

  mpvInteropIosArm64:
    action: !io.github.yuroyami.libmpv.buildplugins.mpvnatives.writeMpvInterop
      konanTarget: ios_arm64
      homebrewPrefix: ${pluginSettings.homebrewPrefix}
      mpvHeaders: ${module.rootDir}/native/include
      prefixTree: ${project.rootDir}/buildscripts/prefix/ios-arm64
      defFile: ${taskOutputDir}/def/mpv.def

  mpvInteropIosSimulatorArm64:
    action: !io.github.yuroyami.libmpv.buildplugins.mpvnatives.writeMpvInterop
      konanTarget: ios_simulator_arm64
      homebrewPrefix: ${pluginSettings.homebrewPrefix}
      mpvHeaders: ${module.rootDir}/native/include
      prefixTree: ${project.rootDir}/buildscripts/prefix/ios-simulator-arm64
      defFile: ${taskOutputDir}/def/mpv.def

  nativeInterop:
    action: !io.github.yuroyami.libmpv.buildplugins.mpvnatives.checkNativeInterop
      defFiles:
        - ${tasks.mpvInteropMacosArm64.action.defFile}
        - ${tasks.mpvInteropIosArm64.action.defFile}
        - ${tasks.mpvInteropIosSimulatorArm64.action.defFile}

  desktopJni:
    action: !io.github.yuroyami.libmpv.buildplugins.mpvnatives.checkDesktopJni
      platforms: [ macos-arm64, linux-x64, linux-arm64, windows-x64 ]
      resourcesDirs:
        - ${tasks.jniMacosArm64.action.resourcesDir}
        - ${tasks.jniLinuxX64.action.resourcesDir}
        - ${tasks.jniLinuxArm64.action.resourcesDir}
        - ${tasks.jniWindowsX64.action.resourcesDir}

  crossToolchains:
    action: !io.github.yuroyami.libmpv.buildplugins.mpvnatives.writeCrossToolchains
      platforms: [ linux-x64, linux-arm64 ]
      kotlinVersion: ${pluginSettings.kotlinVersion}
      prefixRoot: ${project.rootDir}/buildscripts/prefix

  headers:
    action: !io.github.yuroyami.libmpv.buildplugins.mpvnatives.checkMpvHeaders
      vendored: ${module.rootDir}/native/include
      checkout: ${project.rootDir}/buildscripts/deps/mpv/include/mpv

# The JNI libraries go into the JVM jar under libmpv-kmp-native/<platform>/.
generated:
  # The cinterop binding of mpv's client API, one def per Apple target.
  cinteropDefinitions:
    - defFile: ${tasks.mpvInteropMacosArm64.action.defFile}
      fragment: "@macosArm64"
    - defFile: ${tasks.mpvInteropIosArm64.action.defFile}
      fragment: "@iosArm64"
    - defFile: ${tasks.mpvInteropIosSimulatorArm64.action.defFile}
      fragment: "@iosSimulatorArm64"
  resources:
    - directory: ${tasks.jniMacosArm64.action.resourcesDir}
      fragment: "@jvm"
    - directory: ${tasks.jniLinuxX64.action.resourcesDir}
      fragment: "@jvm"
    - directory: ${tasks.jniLinuxArm64.action.resourcesDir}
      fragment: "@jvm"
    - directory: ${tasks.jniWindowsX64.action.resourcesDir}
      fragment: "@jvm"

checks:
  # The vendored mpv headers match buildscripts/deps/mpv when that checkout exists.
  - name: mpvHeaders
    performedBy: headers

commands:
  # The release gate: every platform has a library linked from a static tree.
  - name: checkDesktopJni
    performedBy: desktopJni
  # The Kotlin/Native compilers and sysroots of the Linux and Windows trees, as env files for buildscripts/.
  - name: crossToolchains
    performedBy: crossToolchains
  # The release gate of the Apple klibs: every def binds a static tree.
  - name: checkNativeInterop
    performedBy: nativeInterop
