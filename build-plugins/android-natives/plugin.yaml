tasks:
  package:
    action: !io.github.yuroyami.libmpvkt.buildplugins.androidnatives.packageAndroidNatives
      nativeLibsDir: ${project.rootDir}/${pluginSettings.nativeLibsDir}
      files: ${pluginSettings.files}
      resourcesDir: ${taskOutputDir}/resources

  check:
    action: !io.github.yuroyami.libmpvkt.buildplugins.androidnatives.checkAndroidNatives
      nativeLibsDir: ${project.rootDir}/${pluginSettings.nativeLibsDir}
      files: ${pluginSettings.files}
      minApi: ${pluginSettings.minApi}
      probeSymbol: ${pluginSettings.probeSymbol}
      libcxxMarker: ${pluginSettings.libcxxMarker}

# AGP unpacks lib/<abi>/ of a jar dependency into the APK's native libraries.
generated:
  resources:
    - directory: ${tasks.package.action.resourcesDir}

commands:
  # Checks the ABIs in LIBMPVKT_ABIS (comma-separated), or all four when it is unset.
  - name: checkAndroidNatives
    performedBy: check
