# MpvView, the typed MpvOptions and the one surface handshake. No Compose here.
product:
  type: kmp/lib
  platforms: [ android ]

apply:
  - //libmpvkt.module-template.yaml
  - //android.module-template.yaml
  - //library.module-template.yaml

dependencies:
  - //libmpvkt: exported

test-dependencies:
  - $libs.kotlinx.coroutines.test

settings:
  android:
    namespace: io.github.yuroyami.libmpvkt.view
  publishing:
    pom:
      name: libmpvkt-view
      description: "libmpvKt's Android View: MpvView, which shows mpv's output on a SurfaceView or a TextureView, and MpvOptions."

plugins:
  android-abi-check: enabled
