# The typed API: Mpv, the node model, the catalogs, the events, the playback state, the stream
# providers and the deprecated MPVLib facade. It exports libmpv-kmp-native, so an app names one artifact.
product:
  type: kmp/lib
  platforms: [ android, jvm, macosArm64, iosArm64, iosSimulatorArm64 ]

# Source folders that the default hierarchy does not have.
aliases:
  # The code that the JVM and Android share: the stream providers.
  - jvmAndAndroid: [ jvm, android ]
  # The tests that start a real core, on every platform this host can run them. Android runs them in verification/.
  - core: [ jvm, macosArm64, iosSimulatorArm64 ]
  # The Apple platforms among those, for the test actuals that use Foundation and POSIX.
  - appleCore: [ macosArm64, iosSimulatorArm64 ]

apply:
  - //libmpv-kmp.module-template.yaml
  - //android.module-template.yaml
  - //library.module-template.yaml

dependencies:
  - //libmpv-kmp-native: exported
  - $libs.kotlinx.coroutines.core: exported
  - $libs.kotlinx.atomicfu

test-dependencies:
  - $libs.kotlinx.coroutines.test

settings:
  kotlin:
    freeCompilerArgs: [ -Xexpect-actual-classes ]
    optIns:
      - kotlinx.cinterop.ExperimentalForeignApi
  android:
    namespace: io.github.yuroyami.libmpv
  publishing:
    pom:
      name: libmpv-kmp
      description: "The typed Kotlin API for libmpv on Android, the desktop JVM, macOS and iOS: Mpv, one class per mpv core. It brings libmpv-kmp-native, which holds mpv, FFmpeg, libass, dav1d and their dependencies, prebuilt for each platform. The Android native libraries are GPL, the others LGPL."

# -Xexport-kdoc keeps the KDoc in the native klibs.
settings@native:
  kotlin:
    freeCompilerArgs: [ -Xexport-kdoc ]

# The klib is named "io.github.yuroyami:libmpv-kmp", as a Gradle build would name it. Set per platform: on @native,
# it would also rename the klibs of shared native code, which must keep their own names.

settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:libmpv-kmp, -Xshort-module-name=libmpv-kmp ]

settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:libmpv-kmp, -Xshort-module-name=libmpv-kmp ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:libmpv-kmp, -Xshort-module-name=libmpv-kmp ]

# Tests compile into their own klib, which needs a different name.

test-settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=libmpv_kmp_test, -Xshort-module-name=libmpv_kmp_test ]

test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=libmpv_kmp_test, -Xshort-module-name=libmpv_kmp_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=libmpv_kmp_test, -Xshort-module-name=libmpv_kmp_test ]

plugins:
  abi-check:
    enabled: true
    # The `// Targets:` header of api/<module>.klib.api.
    klibPlatforms: [ iosArm64, iosSimulatorArm64, macosArm64 ]
  android-abi-check: enabled
