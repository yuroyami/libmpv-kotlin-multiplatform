# mpv drawn as a plain Compose image through the render API. libmpvkt_render.so rides
# libmpvkt-canvas-android-natives and links libmpv.so at load time, so use the same version as libmpvkt.
product:
  type: kmp/lib
  platforms: [ android ]

apply:
  - //libmpvkt.module-template.yaml
  - //android.module-template.yaml
  - //library.module-template.yaml
  - //compose.module-template.yaml

dependencies:
  - //libmpvkt-view: exported
  - $libs.compose.runtime
  - $libs.compose.ui
  - $libs.compose.foundation

# The Android libraries ship in a plain jar, which AGP unpacks into the APK's lib/ folder.
dependencies@android:
  - //libmpvkt-canvas-android-natives

test-dependencies:
  - $libs.kotlinx.coroutines.test

settings:
  android:
    namespace: io.github.yuroyami.libmpvkt.canvas
    # AHardwareBuffer and libnativewindow start at API 26.
    minSdk: 26
  publishing:
    pom:
      name: libmpvkt-canvas
      description: "libmpvKt's experimental Compose canvas: mpv drawn through its render API into bitmaps Compose can transform, blur or capture. Use the same version as libmpvkt."

plugins:
  android-abi-check: enabled
