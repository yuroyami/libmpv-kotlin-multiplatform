# Publishes every libmpv-kotlin-multiplatform library module to Maven Central (the Central Portal) with the Kotlin
# toolchain: `./kotlin publish mavenCentral`. Started by hand.
#
# No native library is compiled from source here. The Android libraries and the six static mpv
# trees are downloaded from the GitHub release named by the version and checksum verified.
# checkAndroidNatives checks the libraries before the natives jars are assembled, and checkTrees
# checks the trees. Run "Release natives" for v<version> first.
#
# The job runs on an arm64 Mac, because the macOS JNI library and the Apple klibs build only there.
# The Linux and Windows JNI libraries link on the same Mac, from the trees. checkDesktopJni and
# checkNativeInterop then refuse a release unless every desktop platform and every Apple target links
# a tree from buildscripts/prefix/<platform>.
#
# By default the deployment waits on the Central Portal after validation (publishingMode manual in
# library.module-template.yaml). Nothing in a deployment is public until a person presses Publish
# on the portal, and that releases all of it together. Drop a failed or wrong deployment on the
# portal instead of releasing it. The release input switches this run to auto.
#
# Maven Central never replaces a published version. A wrong version is followed by a corrected one.
#
# Secrets:
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD    a Central Portal user token
#   SIGNING_IN_MEMORY_KEY, SIGNING_IN_MEMORY_KEY_PASSWORD    an ASCII-armored GPG key and its passphrase
# The toolchain reads the key id from the key itself.
#
# Publishing from the maintainer's machine works the same way, with the same four values in the
# KOTLIN_TOOLCHAIN_* variables of the last step:
#   .github/scripts/fetch-natives.sh v<version>
#   .github/scripts/fetch-natives.sh v<version> trees
#   buildscripts/download-deps.sh --tools-only
#   ./kotlin do crossToolchains
#   ./kotlin do checkAndroidNatives
#   ./kotlin do checkTrees
#   ./kotlin do checkDesktopJni
#   ./kotlin do checkNativeInterop
#   ./kotlin publish mavenCentral -m <module> -m <module> ...
name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match settings.publishing.version in library.module-template.yaml), e.g. 0.4.0"
        required: true
      release:
        description: "Also release the deployment on the Central Portal. Off leaves it validated for a person to publish."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.version }}
  cancel-in-progress: false

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"
  # Every module that publishes. The natives jars publish beside the modules that depend on them.
  PUBLISHED_MODULES: >-
    libmpv-kmp-native libmpv-kmp-android-natives libmpv-kmp libmpv-kmp-view libmpv-kmp-compose
    libmpv-kmp-canvas libmpv-kmp-canvas-android-natives

jobs:
  check-version:
    name: input matches the publishing version and the changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The tag, not the branch head: Release natives built the zips from this commit.
      - uses: actions/checkout@v4
        with:
          ref: v${{ github.event.inputs.version }}
      - name: Assert version match
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the version must look like 1.2.3, not $VERSION" >&2
            exit 1
          fi
          template_version="$(sed -n 's/^    version:[[:space:]]*//p' library.module-template.yaml | tr -d '[:space:]')"
          if [ "${template_version}" != "${VERSION}" ]; then
            echo "::error::library.module-template.yaml has version ${template_version} but the run asked for ${VERSION}" >&2
            exit 1
          fi
          # A dated heading: '## [x.y.z] - unreleased' is not a release yet.
          if ! grep -Eq "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [${VERSION}] - YYYY-MM-DD' section; write the notes before publishing" >&2
            exit 1
          fi
          echo "Publishing ${VERSION}"

  publish:
    name: every library module to Maven Central
    needs: check-version
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      # The same tagged commit whose natives the next steps download, so Kotlin and C++ match.
      - uses: actions/checkout@v4
        with:
          ref: v${{ github.event.inputs.version }}

      # Central refuses a second upload of a version too, but only after the whole build.
      - name: Refuse a version that Maven Central already has
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          for module in $PUBLISHED_MODULES; do
            url="https://repo1.maven.org/maven2/io/github/yuroyami/$module/$VERSION/$module-$VERSION.pom"
            if curl -sfI "$url" > /dev/null; then
              echo "::error::$url exists; a published version is never replaced. Publish a new version." >&2
              exit 1
            fi
          done

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-publish-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-publish-

      - name: Fetch the release's native libraries
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: .github/scripts/fetch-natives.sh "v$VERSION"

      - name: Check them
        run: |
          # `do` is a command of the kotlin script here, not the shell keyword.
          # shellcheck disable=SC1010
          ./kotlin do checkAndroidNatives

      - name: Fetch the release's static mpv trees
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: .github/scripts/fetch-natives.sh "v$VERSION" trees

      - name: Check the trees
        run: |
          # shellcheck disable=SC1010
          ./kotlin do checkTrees

      # The Linux libraries link with the clang and sysroots of Kotlin/Native, the Windows library with llvm-mingw.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ hashFiles('libmpv-kmp.module-template.yaml') }}
      - name: Fetch the cross toolchains
        run: |
          buildscripts/download-deps.sh --tools-only
          # shellcheck disable=SC1010
          ./kotlin do crossToolchains

      # Every desktop platform links a static tree, not Homebrew's mpv, and exports only its JNI functions.
      - name: Check the desktop JNI libraries
        run: |
          # shellcheck disable=SC1010
          ./kotlin do checkDesktopJni

      # Every Apple target binds a static tree, not Homebrew's mpv and not the headers alone.
      - name: Check the Apple bindings
        run: |
          # shellcheck disable=SC1010
          ./kotlin do checkNativeInterop

      # A missing secret reads as empty, and the build would then publish unsigned or not at all.
      - name: Refuse to publish without the secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          for v in CENTRAL_USERNAME CENTRAL_PASSWORD KEY KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::the secret behind $v is empty" >&2
              exit 1
            fi
          done

      # The same publication into the runner's ~/.m2 first, so an unsigned file stops the run
      # before anything reaches the portal.
      - name: Publish locally and refuse unsigned files
        env:
          VERSION: ${{ github.event.inputs.version }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flags=()
          for module in $PUBLISHED_MODULES; do flags+=(-m "$module"); done
          ./kotlin publish mavenLocal "${flags[@]}"
          repo="$HOME/.m2/repository/io/github/yuroyami"
          for module in $PUBLISHED_MODULES; do
            [ -d "$repo/$module/$VERSION" ] || { echo "::error::$module $VERSION is missing from the local publication" >&2; exit 1; }
          done
          unsigned="$(find "$repo" -path "*/$VERSION/*" \( -name '*.aar' -o -name '*.jar' -o -name '*.pom' -o -name '*.module' \) ! -exec test -e '{}.asc' \; -print)"
          if [ -n "$unsigned" ]; then
            echo "::error::these files have no signature: $unsigned" >&2
            exit 1
          fi
          find "$repo" -path "*/$VERSION/*" -type f | sort

      - name: Publish to Maven Central
        env:
          RELEASE: ${{ github.event.inputs.release }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" = "true" ]; then
            # Only in this runner's checkout: the committed default stays manual.
            # BSD sed on the macOS runner needs the empty backup suffix.
            sed -i '' 's/publishingMode: manual/publishingMode: auto/' library.module-template.yaml ./*/module.yaml
          fi
          # One run for every module, so the portal receives one deployment.
          flags=()
          for module in $PUBLISHED_MODULES; do flags+=(-m "$module"); done
          ./kotlin publish mavenCentral "${flags[@]}"
