# Every push and pull request: the gate, the static mpv trees, the JVM, macOS and iOS core on macOS, the JVM core on Linux
# and Windows, the natives with their packaging and the sample, and the device tests on an emulator.
#
# Every job builds with the Kotlin toolchain (`./kotlin`), which downloads its own JDK. The Android
# SDK comes from the runner image (ANDROID_HOME). The device tests are a separate Gradle build
# (verification/device-tests), so that job also sets up a JDK for it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pull request runs replace each other. A run on main finishes, so an uncached native build is not lost.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  gate:
    name: host tests, ABI dumps, build logic, dash scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-gate-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-gate-
      # The same script as the local gate, so CI and a laptop run one list of commands.
      - run: scripts/check-gate.sh tier1

  trees:
    uses: ./.github/workflows/build-trees.yml

  desktop:
    name: JVM, macOS and iOS core on macOS
    needs: trees
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-desktop-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-desktop-
      # The JNI library and the Apple klibs link the static trees, never Homebrew's mpv.
      - uses: actions/download-artifact@v4
        with:
          pattern: tree-*
          merge-multiple: true
      - run: |
          mkdir -p buildscripts/prefix
          for p in macos-arm64 ios-arm64 ios-simulator-arm64; do tar -xzf "libmpv-kmp-tree-$p.tar.gz" -C buildscripts/prefix; done
      # mpv returns no core under a numeric locale other than C. The JVM takes the user's locale, so test a decimal comma.
      - run: ./kotlin test -m libmpv-kmp-native -m libmpv-kmp -p jvm
        env:
          LC_ALL: de_DE.UTF-8
      - run: ./kotlin test -m libmpv-kmp-native -m libmpv-kmp -p macosArm64
      - run: ./kotlin test -m libmpv-kmp-native -m libmpv-kmp -p iosSimulatorArm64
      - run: ./kotlin build -m libmpv-kmp-native -m libmpv-kmp -p iosArm64
      - name: Check that every Apple klib binds a tree
        run: |
          # `do` is a command of the kotlin script here, not the shell keyword.
          # shellcheck disable=SC1010
          ./kotlin do checkNativeInterop
      - run: ./kotlin check klibAbi -m libmpv-kmp-native -m libmpv-kmp

  linux:
    name: JVM core on Linux
    needs: trees
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-linux-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-linux-
            kotlin-gate-
      # The trees job links the Linux library on macOS. This job has no tree, so the build here links nothing.
      - uses: actions/download-artifact@v4
        with:
          name: jni-linux-x64
          path: jni
      # The configuration files of the system alsa-lib. LinuxAudioTest replaces the top file with ALSA_CONFIG_PATH.
      - run: sudo apt-get update && sudo apt-get install -y libasound2t64
      - run: ./kotlin test -m libmpv-kmp-native -m libmpv-kmp -p jvm
        env:
          JAVA_TOOL_OPTIONS: -Dlibmpv-kmp.jni.path=${{ github.workspace }}/jni/libmpv_kmp_jni.so
          ALSA_CONFIG_PATH: ${{ runner.temp }}/asound.conf

  windows:
    name: JVM core on Windows
    needs: trees
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The trees job links the Windows library on macOS. This job has no tree, so the build here links nothing.
      - uses: actions/download-artifact@v4
        with:
          name: jni-windows-x64
          path: jni
      # The runner has no sound device. The core tests use ao=null.
      - run: ./kotlin.bat test -m libmpv-kmp-native -m libmpv-kmp -p jvm
        env:
          JAVA_TOOL_OPTIONS: -Dlibmpv-kmp.jni.path=${{ github.workspace }}\jni\mpv_kmp_jni.dll

  natives:
    uses: ./.github/workflows/build-natives.yml

  packaging:
    name: natives jars and sample
    needs: [gate, natives]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-packaging-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-packaging-
            kotlin-gate-
      - uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: dist
          merge-multiple: true
      - name: Put the libraries in place through the same path a release uses
        run: LIBMPV_KMP_NATIVES_BASE="file://$PWD/dist" .github/scripts/fetch-natives.sh local

      # Every check on the four ABIs: the files, the 16 KB alignment, the JNI symbol, the libc++.
      - name: Check the native libraries
        run: |
          # `do` is a command of the kotlin script here, not the shell keyword.
          # shellcheck disable=SC1010
          ./kotlin do checkAndroidNatives

      - name: Build the natives jars
        run: ./kotlin build -m libmpv-kmp-android-natives -m libmpv-kmp-canvas-android-natives

      # The core jar holds ten libraries per ABI, and the canvas jar holds one.
      - name: Check what the natives jars hold
        run: |
          set -euo pipefail
          mkdir -p build/ci-artifacts
          check_jar() {
            local name="$1" libs="$2" rules="$3" jar
            jar="$(find build -name "$name*.jar" ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
            [ -n "$jar" ] || { echo "::error::the build made no $name jar"; exit 1; }
            count="$(unzip -l "$jar" | grep -cE ' lib/[^/]+/[^/]+\.so$' || true)"
            if [ "$count" -ne "$libs" ]; then
              echo "::error::$jar holds $count libraries, not $libs"; exit 1
            fi
            unzip -l "$jar" "META-INF/proguard/$rules" > /dev/null || { echo "::error::$jar has no META-INF/proguard/$rules"; exit 1; }
            echo "$jar: $count libraries and $rules"
            cp "$jar" build/ci-artifacts/
          }
          check_jar libmpv-kmp-android-natives 40 libmpv-kmp-native.pro
          check_jar libmpv-kmp-canvas-android-natives 4 libmpv-kmp-canvas.pro

      # The release build runs R8 with the keep rules that the natives jars publish.
      - name: Build the sample, debug and release
        run: |
          ./kotlin build -m sample
          ./kotlin build -m sample --variant release

      - name: Check that the sample carries the libraries
        run: |
          set -euo pipefail
          apks="$(find build -path '*sample*' -name '*.apk')"
          [ -n "$apks" ] || { echo "::error::the build made no sample APK"; exit 1; }
          for apk in $apks; do
            for abi in arm64-v8a armeabi-v7a x86 x86_64; do
              unzip -l "$apk" "lib/$abi/libmpv_kmp_jni.so" > /dev/null || { echo "::error::$apk has no lib/$abi/libmpv_kmp_jni.so"; exit 1; }
            done
            echo "$apk carries the four ABIs"
            cp "$apk" build/ci-artifacts/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-kmp-packaging
          path: build/ci-artifacts/
          if-no-files-found: error
          retention-days: 7

  emulator:
    name: device tests on API ${{ matrix.api }}
    needs: natives
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 35 exercises the canvas renderer's zero-copy path (Bitmap.wrapHardwareBuffer, API 29+).
        # 28 is the only way to exercise its readback path, which no current phone can reach.
        # 21 is the core modules' minSdk. The canvas module starts at 26, so it sits that one out.
        # An empty task list runs every device test project.
        include:
          - api: 35
            tasks: ""
          - api: 28
            tasks: ""
          - api: 21
            tasks: ":native:connectedAndroidDeviceTest :core:connectedAndroidDeviceTest :view:connectedAndroidDeviceTest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-emulator-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-emulator-
            kotlin-packaging-
      - uses: actions/download-artifact@v4
        with:
          name: natives-x86_64
          path: dist
      - run: LIBMPV_KMP_NATIVES_BASE="file://$PWD/dist" .github/scripts/fetch-natives.sh local x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The script stages the libraries of this checkout, then runs the device tests on the emulator.
      - name: Run the device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb logcat -c
            LIBMPV_KMP_ABIS=x86_64 scripts/run-device-tests.sh ${{ matrix.tasks }} || echo "TESTS_FAILED" > tests-failed
            adb logcat -d -s libmpv-kmp:I mpv:W > canvas-measurements.txt
            adb logcat -d -b crash > crash.txt
            grep -c CANVAS-MEASUREMENT canvas-measurements.txt || true
            test ! -f tests-failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-report-api-${{ matrix.api }}
          path: |
            verification/device-tests/*/build/reports/androidTests
            verification/device-tests/*/build/outputs/androidTest-results
            canvas-measurements.txt
            crash.txt
          if-no-files-found: warn
