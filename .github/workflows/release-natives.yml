# Builds the four ABIs and the six static mpv trees and attaches them, with their checksums and the
# source offer, to the GitHub release for the tag. Started by hand. publish.yml then assembles the
# natives jars from the ABI zips and links the desktop and Apple artifacts from the trees, so what is
# on Maven Central is what anyone can inspect on the release page.
name: Release natives

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag, e.g. v0.1.0. Created at this commit if it does not exist."
        required: true

permissions:
  contents: read

concurrency:
  group: release-natives-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  # Fails in seconds, before four native builds start, on a tag that would publish the wrong thing.
  check-tag:
    name: the tag is v<version>, and free or already on this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag
        env:
          TAG: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^    version:[[:space:]]*//p' library.module-template.yaml | tr -d '[:space:]')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the tag must be v$version, from the version in library.module-template.yaml, not $TAG" >&2
            exit 1
          fi
          existing="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
          [ -n "$existing" ] || existing="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG already points at $existing, not at this run's commit $GITHUB_SHA" >&2
            exit 1
          fi
          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -q .; then
            echo "::error::the $TAG release already has files; a published release is never replaced" >&2
            exit 1
          fi

  natives:
    needs: check-tag
    uses: ./.github/workflows/build-natives.yml

  trees:
    needs: check-tag
    uses: ./.github/workflows/build-trees.yml

  publish:
    name: attach to the release
    needs: [natives, trees]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: natives-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: tree-*
          path: dist
          merge-multiple: true

      # The source offer: the exact mpv, FFmpeg and alsa-lib sources, beside the binaries, for as long
      # as the binaries are distributed. Every other library is named with its tag and commit.
      - name: Fetch the source tarballs and write SOURCES.txt
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          . buildscripts/include/depinfo.sh
          curl -fL --retry 3 -o "dist/mpv-v${v_mpv}-source.tar.gz" "https://github.com/mpv-player/mpv/archive/refs/tags/v${v_mpv}.tar.gz"
          curl -fL --retry 3 -o "dist/ffmpeg-n${v_ffmpeg}-source.tar.gz" "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n${v_ffmpeg}.tar.gz"
          curl -fL --retry 3 -o "dist/alsa-lib-v${v_alsa}-source.tar.gz" "https://github.com/alsa-project/alsa-lib/archive/refs/tags/v${v_alsa}.tar.gz"
          ( cd dist && shasum -a 256 mpv-v${v_mpv}-source.tar.gz ffmpeg-n${v_ffmpeg}-source.tar.gz alsa-lib-v${v_alsa}-source.tar.gz > sources.sha256 )
          {
            echo "libmpv-kotlin-multiplatform ${TAG}: the sources the native libraries were built from."
            echo
            echo "mpv          v${v_mpv}          https://github.com/mpv-player/mpv/tree/v${v_mpv}"
            echo "FFmpeg       n${v_ffmpeg}       https://github.com/FFmpeg/FFmpeg/tree/n${v_ffmpeg}"
            echo "libass       ${v_libass}        https://github.com/libass/libass/tree/${v_libass}"
            echo "libplacebo   v${v_libplacebo}   https://code.videolan.org/videolan/libplacebo/-/tree/v${v_libplacebo}"
            echo "dav1d        ${v_dav1d}         https://code.videolan.org/videolan/dav1d/-/tree/${v_dav1d}"
            echo "Mbed TLS     v${v_mbedtls}      https://github.com/Mbed-TLS/mbedtls/tree/v${v_mbedtls}"
            echo "HarfBuzz     ${v_harfbuzz}      https://github.com/harfbuzz/harfbuzz/tree/${v_harfbuzz}"
            echo "FreeType     VER-${v_freetype//./-}   https://gitlab.freedesktop.org/freetype/freetype/-/tree/VER-${v_freetype//./-}"
            echo "FriBidi      v${v_fribidi}      https://github.com/fribidi/fribidi/tree/v${v_fribidi}"
            echo "libunibreak  ${v_unibreak}      https://github.com/adah1972/libunibreak/releases/tag/libunibreak_${v_unibreak//./_}"
            echo "Lua          ${v_lua}           https://www.lua.org/ftp/lua-${v_lua}.tar.gz"
            echo "libxml2      v${v_libxml2}      https://gitlab.gnome.org/GNOME/libxml2/-/tree/v${v_libxml2}"
            echo "fontconfig   ${v_fontconfig}    https://gitlab.freedesktop.org/fontconfig/fontconfig/-/tree/${v_fontconfig}   (Android and Linux)"
            echo "alsa-lib     v${v_alsa}         https://github.com/alsa-project/alsa-lib/tree/v${v_alsa}   (Linux trees)"
            echo "zlib         v${v_zlib}         https://github.com/madler/zlib/tree/v${v_zlib}   (Windows tree)"
            echo "NDK          ${v_ndk}"
            echo "llvm-mingw   ${tool_llvm_mingw}   https://github.com/mstorsjo/llvm-mingw/releases/tag/${tool_llvm_mingw}   (Windows tree)"
            echo
            echo "Commit hashes per library are in BUILD-INFO.txt inside each zip and each tree."
          } > dist/SOURCES.txt
          ls -l dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/libmpv-kmp-tree-*.tar.gz

      - name: Publish to the ${{ github.event.inputs.tag }} release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          # Tag the commit that was built, not whatever the default branch holds by upload time.
          target_commitish: ${{ github.sha }}
          overwrite_files: false
          name: libmpv-kotlin-multiplatform ${{ github.event.inputs.tag }}
          body: "Native libraries for libmpv-kotlin-multiplatform ${{ github.event.inputs.tag }}. The natives jars on Maven Central are assembled from exactly the libmpv-kmp-natives zips. Each libmpv-kmp-symbols zip holds the unstripped copies of the same libraries, with the same build ids, for crash symbolication. Each libmpv-kmp-tree tarball is the static LGPL mpv tree that the desktop and Apple artifacts link. SOURCES.txt and the source tarballs are the source offer for the binaries."
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.sha256
            dist/*.tar.gz
            dist/SOURCES.txt
