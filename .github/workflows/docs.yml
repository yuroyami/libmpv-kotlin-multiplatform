# Builds the MkDocs site and the Dokka API reference. A push validates them; only a hand-started
# run deploys to GitHub Pages (https://yuroyami.github.io/libmpv-kotlin-multiplatform/), so an unpublished main
# never replaces the public docs. Pages must be set to "GitHub Actions" in the repository settings.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**/*.kt'
      - '**/module.yaml'
      - '*.module-template.yaml'
      - 'project.yaml'
      - 'libs.versions.toml'
      - 'build-plugins/**'
      - 'dokka-templates/**'
      - '.github/workflows/docs.yml'
  # A pull request builds the site too, so a broken page or a dependency bump fails before merge.
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**/*.kt'
      - '**/module.yaml'
      - '*.module-template.yaml'
      - 'project.yaml'
      - 'libs.versions.toml'
      - 'build-plugins/**'
      - 'dokka-templates/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# The build job runs pip and the toolchain's third-party plugins, so it gets read access only.
permissions:
  contents: read

# One queue per event and ref. Only the deploy job uses the pages group, so a push can no longer
# cancel a deploy that is waiting.
concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict --site-dir site
      - uses: actions/cache@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-docs-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-docs-
            kotlin-gate-
      # `dokka` writes the pages of each published module, and `dokkaSite` merges them into build/dokka/html.
      - name: Generate the API reference into the site
        env:
          KOTLIN_CLI_NO_WELCOME_BANNER: "1"
        run: |
          # `do` is a command of the kotlin script here, not the shell keyword.
          # shellcheck disable=SC1010
          ./kotlin do dokka
          # shellcheck disable=SC1010
          ./kotlin do dokkaSite
          mkdir -p site/api
          cp -r build/dokka/html/. site/api/
      - run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
