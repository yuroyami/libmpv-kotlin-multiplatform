# libmpvkt_render.so of libmpvkt-canvas, as lib/<abi>/ in a plain jar, with the canvas keep rules.
# libmpvkt-canvas depends on it for Android only. The library links libmpv.so from
# libmpvkt-android-natives at load time, so both must have the same version.
product: jvm/lib

apply:
  - //libmpvkt.module-template.yaml
  - //library.module-template.yaml

settings:
  publishing:
    pom:
      name: libmpvkt-canvas-android-natives
      description: "The Android render library of libmpvkt-canvas for arm64-v8a, armeabi-v7a, x86 and x86_64. It comes with libmpvkt-canvas; never add it yourself."

plugins:
  android-natives:
    enabled: true
    nativeLibsDir: libmpvkt-canvas/native-libs
    files: [ libmpvkt_render.so ]
    # AHardwareBuffer and libnativewindow start at API 26.
    minApi: 26
