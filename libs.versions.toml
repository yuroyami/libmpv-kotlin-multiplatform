[versions]
# The Kotlin version is a module setting (settings.kotlin.version in libmpv-kmp.module-template.yaml).
coroutines = "1.11.0"
atomicfu = "0.33.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# The Compose FLOOR of libmpv-kmp-compose, not a pin: Gradle raises it to whatever the app uses.
composeFloor = "1.9.0"
activityCompose = "1.14.0-alpha03"
# The ABI dump library of build-plugins/abi-check. Keep it equal to settings.kotlin.version.
kotlinAbiTools = "2.4.21"

[libraries]
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# The atomicfu library only. The toolchain applies no atomicfu bytecode transform.
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "composeFloor" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeFloor" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "composeFloor" }
compose-material = { module = "androidx.compose.material:material", version.ref = "composeFloor" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
kotlin-abi-tools-api = { module = "org.jetbrains.kotlin:abi-tools-api", version.ref = "kotlinAbiTools" }
kotlin-abi-tools = { module = "org.jetbrains.kotlin:abi-tools", version.ref = "kotlinAbiTools" }
