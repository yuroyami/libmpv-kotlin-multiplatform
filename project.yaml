# The library modules and the local build plugins of libmpv-kotlin-multiplatform.
modules:
  - build-plugins/abi-check
  - build-plugins/android-abi-check
  - build-plugins/android-natives
  - build-plugins/build-info
  - build-plugins/build-support
  - build-plugins/dokka
  - libmpv-kmp
  - libmpv-kmp-android-natives
  - libmpv-kmp-canvas
  - libmpv-kmp-canvas-android-natives
  - libmpv-kmp-compose
  - libmpv-kmp-native
  - libmpv-kmp-view
  - sample

plugins:
  - //build-plugins/abi-check
  - //build-plugins/android-abi-check
  - //build-plugins/android-natives
  - //build-plugins/build-info
  - //build-plugins/dokka
