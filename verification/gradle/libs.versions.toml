# The versions of the device-test build in this folder. Kotlin matches libmpv-kmp.module-template.yaml
# in the repository root. The androidx test versions are the ones the Gradle build used before the
# move, because they still run on API 21.
[versions]
kotlin = "2.4.21"
agp = "9.5.2"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
coroutines = "1.11.0"
# The tests of libmpv-kmp use atomicfu, which the library POM lists for runtime only. Matches libs.versions.toml in the root.
atomicfu = "0.33.0"
# The Compose floor of the libraries. The canvas tests read frames as Compose ImageBitmaps.
composeFloor = "1.9.0"

[libraries]
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeFloor" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
