# Settings that every published libmpv-kotlin-multiplatform library shares, on top of libmpv-kmp.module-template.yaml.
# Each library sets its own POM name and description.

# `./kotlin publish mavenLocal -m <module>` puts a build into ~/.m2 for tests in other projects.
repositories:
  - url: mavenLocal
    publish: true
    resolve: false

settings:
  kotlin:
    explicitApi: strict
  publishing:
    enabled: true
    group: io.github.yuroyami
    version: 0.3.0
    pom:
      url: https://github.com/yuroyami/libmpv-kotlin-multiplatform
      licenses:
        # The Kotlin wrapper, the JNI sources and the build scripts.
        - name: Apache License 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
        # The Android native libraries. mpv is GPL-2.0-or-later and its FFmpeg is built with
        # --enable-gpl --enable-version3, so the combination is GPL-3.0-or-later. NOTICE lists each library.
        - name: GNU General Public License v3.0 or later
          url: https://www.gnu.org/licenses/gpl-3.0.txt
        # The static mpv trees of the desktop JVM and Apple libraries: mpv with -Dgpl=false and FFmpeg
        # without --enable-gpl, so the combination is LGPL-3.0-or-later.
        - name: GNU Lesser General Public License v3.0 or later
          url: https://www.gnu.org/licenses/lgpl-3.0.txt
      # Maven Central rejects a bundle with no developer. Identity only, no address.
      developers:
        - id: yuroyami
          name: yuroyami
          url: https://github.com/yuroyami
      scm:
        url: https://github.com/yuroyami/libmpv-kotlin-multiplatform
        connection: scm:git:https://github.com/yuroyami/libmpv-kotlin-multiplatform.git
        developerConnection: scm:git:ssh://git@github.com/yuroyami/libmpv-kotlin-multiplatform.git
    signArtifacts: true
    publishSources: true
    # auto releases the deployment once the Central Portal has validated it.
    # publish.yml switches it to manual when its release input is off.
    mavenCentral:
      enabled: true
      publishingMode: auto
